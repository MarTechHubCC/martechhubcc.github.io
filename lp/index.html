<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<title>Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
/* ═══ Landing Page · Test Drive · MarTech V4.12 New Jersey (4 Nov 2026)
   Mockup 03, approved 4 Nov: pick a car → name and mobile → date, place,
   time → booked. V1.1 (mockup 11, 4 Nov): an optional time-frame question,
   a picture across the top with the logo and headline on it, choice cards
   that sell each choice, a mobile box of dots that fill, and never a scroll. One phone screen, equal rows, never scrolls; each step
   replaces the last. Every word, choice, place, slot, number and colour
   comes from the page's setup in MarTech (lp_pages.config); the logo from
   Client Centre.
     ?p=<slug>     the page
     &test=1       bookings and visits are recorded as tests (any status)
     ?preview=1    MarTech's setup preview: no database; draws what MarTech
                   sends (lp-preview) and can be moved to a step (lp-goto). */
:root{--brand:#2E3192;--brand-dk:#22256f;--brand-lt:#5a5dad;--brand-soft:#ECEDF8;--ink:#17181f;--muted:#6b6e80;--line:#e3e4ee;--bg:#f6f6fa;--ok:#1f8a4c;
  --gap:8px;--pad:14px;color-scheme:only light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ── phone: one screen, rows of equal units ── */
.app{width:min(100vw,480px);height:100dvh;background:#fff;position:relative;overflow:hidden;
  padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
  display:grid;grid-template-rows:repeat(12,minmax(0,1fr));grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.top{grid-row:span 1;display:flex;align-items:center;justify-content:space-between}
.top img{height:78%;max-height:40px}
.top .call{height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none}
.hero{grid-row:span 3;justify-content:flex-end!important;gap:14px;border-radius:20px;background:linear-gradient(140deg,var(--brand) 0%,var(--brand-lt) 100%);color:#fff;padding:18px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h1{font-size:clamp(24px,7vw,30px);line-height:1.08;letter-spacing:-.02em;font-weight:700}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap}
.hero .chips span{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.14);padding:5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.prog{grid-row:span 1;display:flex;flex-direction:column;justify-content:center;gap:7px}
.prog .bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .35s ease}
.step{grid-row:span 6;display:flex;flex-direction:column;gap:var(--gap);min-height:0;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.q{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin-top:-4px}
.go{grid-row:span 1;border:0;border-radius:16px;background:var(--brand);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s}
.go:active{transform:scale(.98)}
.go:disabled{background:#b9bbd6;cursor:default}

/* model tiles: a grid that fills the step */
.models{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:var(--gap);min-height:0}
.models button{border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:pointer;text-align:left}
/* the first step moves on by itself, so it needs no Continue: its tiles take that row */
.app.s1 .go{display:none}
.app.s1 .step[data-s="1"]{grid-row:span 7}
@media(min-width:900px){.app.s1 .step[data-s="1"]{grid-row:span 10}}
.models button small{font-size:11px;font-weight:500;color:var(--muted)}
.models button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.models button.on::after{content:"\ea5e";font-family:"tabler-icons";font-size:18px}

/* fields */
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.in{height:54px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font-size:17px;background:#fff;outline:none;width:100%}
.in:focus{border-color:var(--brand)}
.mob{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;height:54px;overflow:hidden}
.mob:focus-within{border-color:var(--brand)}
.mob span{padding:0 10px 0 14px;font-size:17px;color:var(--muted);border-right:1px solid var(--line)}
.mob input{border:0;height:100%;flex:1;padding:0 12px;font-size:17px;outline:none;letter-spacing:.02em}

/* where and when */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.seg button{height:58px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.seg button.on,.days button.on,.slots button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button,.slots button{height:52px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.days button small,.slots button small{font-size:10.5px;color:var(--muted)}
.days button b{font-size:15px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slots button{font-weight:600;font-size:13px}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:auto}
.consent input{width:18px;height:18px;accent-color:var(--brand);flex:none;margin-top:1px}
.consent a{color:var(--brand)}

/* done */
.done{grid-row:span 11;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;animation:in .3s ease both}
.tick{width:76px;height:76px;border-radius:50%;background:#e6f4ec;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.3,1) both}
.tick i{font-size:40px;color:var(--ok)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.done h2{font-size:24px;letter-spacing:-.02em}
.card{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.card span{color:var(--muted)}
.card b{font-weight:600}
.acts{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.acts a{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;text-decoration:none;font-size:15px}
.acts .wa{background:#1fa855;color:#fff}
.acts .cl{border:1.5px solid var(--line);color:var(--ink)}
.done .fine{font-size:12px;color:var(--muted)}

/* laptop: the photo half beside the phone flow */
@media(min-width:900px){
  body{background:var(--bg)}
  .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) 460px;width:min(1180px,calc(100vw - 48px));height:min(760px,calc(100dvh - 48px));
    border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(20,22,60,.14);background:#fff}
  .side{background:linear-gradient(150deg,var(--brand) 0%,var(--brand-lt) 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .side::after{content:"";position:absolute;right:-120px;bottom:-140px;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.06)}
  .side .logo{background:#fff;border-radius:14px;padding:10px 16px;align-self:flex-start}
  .side .logo img{height:44px;display:block}
  .side h1{font-size:52px;line-height:1.02;letter-spacing:-.03em;max-width:480px}
  .side p{font-size:17px;opacity:.8;max-width:420px;margin-top:14px;line-height:1.45}
  .side .chips{display:flex;gap:8px;flex-wrap:wrap}
  .side .chips span{font-size:13px;font-weight:600;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .app{width:auto;height:100%}
  .app .hero{display:none}
  .app .top > span{visibility:hidden}
  .step{grid-row:span 9}
}
@media(max-width:899px){.side{display:none}.wrap{display:contents}}
/* the page is one screen: it never scrolls, like Link Tree */
html,body{overflow:hidden;overscroll-behavior:none}
body.loading .wrap,body.loading .gone{visibility:hidden}
.nm{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--brand)}
.top > span{height:100%;display:flex;align-items:center}
.top > span img{height:78%;max-height:40px}
.side .logo .nm{font-size:22px}
.err{font-size:13px;color:#b42318;font-weight:600}
.test{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;z-index:4;font-size:10px;font-weight:700;letter-spacing:.08em;background:#4F7FD6;color:#fff;padding:3px 8px;border-radius:20px}
.gone{width:min(100vw,480px);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center}
.gone img{max-width:62%;max-height:90px;object-fit:contain}
.gone p{color:var(--muted);font-size:15px;line-height:1.5}
.app.s1 .step[data-s="f"]{grid-row:span 7}
@media(min-width:900px){.app.s1 .step[data-s="f"]{grid-row:span 10}}
.models.frames{grid-template-columns:minmax(0,1fr)}
/* rich choice cards: tag, name, who it is for, and three features (design C) */
.models.rich button{--c:var(--brand);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:10px;padding:8px 12px 8px 14px;border-left:5px solid var(--c);text-align:left;color:var(--ink)}
.models.rich button::after{display:none}
.models.rich button[data-plain]{grid-template-columns:minmax(0,1fr)}
.models.rich button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff);color:var(--ink);box-shadow:inset 0 0 0 1px var(--c)}
.models.rich .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.models.rich .l em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.models.rich .l b{font-size:16px;line-height:1.15}
.models.rich .l small{font-size:12px;font-weight:500;color:var(--muted);line-height:1.3}
.models.rich .r{display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line);padding-left:10px;min-width:0}
.models.rich .r i{font-style:normal;font-size:11.5px;font-weight:600;position:relative;padding-left:10px;line-height:1.25}
.models.rich .r i::before{content:"";position:absolute;left:0;top:5px;width:5px;height:5px;border-radius:50%;background:var(--c)}
@media(max-height:700px){.models.rich .l small{display:none}.models.rich .r{gap:2px}}
@media(max-height:600px){.models.rich .l em{display:none}}
@media(max-height:520px) and (orientation:landscape){
  .models.rich{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(2,1fr)!important}
  .models.rich button{grid-template-columns:minmax(0,1fr);padding:4px 10px;gap:3px;align-content:center}
  .models.rich .l em{display:none}.models.rich .r{gap:0;border-left:0;padding-left:0}
  .models.rich .r i{font-size:10.5px;line-height:1.2}.models.rich .r i::before{top:4px}.models{gap:5px}
}
body.tr .mob input{min-width:0;width:0}
/* the mobile box: ten empty slots that fill as the number is typed */
body.tr .mob .mbw{position:relative;flex:1;height:100%;display:block;min-width:0}
body.tr .mob .mbw input{position:absolute;inset:0;width:100%;height:100%;color:transparent;caret-color:transparent;background:transparent;border:0;padding:0 12px;outline:none}
body.tr .mob .mbw input::selection{background:transparent}
body.tr .mob .mask{position:absolute;inset:0;display:flex;align-items:center;gap:2px;padding:0 12px;pointer-events:none;font-style:normal}
body.tr .mob .mask b{width:10.5px;height:24px;display:flex;align-items:flex-end;justify-content:center;font-size:17px;font-weight:500;color:var(--ink);border-bottom:2px solid #d3d3db;line-height:1;padding-bottom:3px;font-variant-numeric:tabular-nums}
body.tr .mob .mask b.d{border-bottom-color:transparent}
body.tr .mob .mask b.c{border-bottom-color:var(--brand);animation:blink 1s step-end infinite}
body.tr .mob .mask u{width:9px;text-decoration:none}
@keyframes blink{50%{border-bottom-color:#d3d3db}}
/* Chirag chose C (4 Nov): light dots that turn into digits */
body.tr .mob .mask.dots b{border-bottom:0;align-items:center;padding:0;animation:none}
body.tr .mob .mask.dots b.e::after{content:"";width:6px;height:6px;border-radius:50%;background:#d3d3db}
body.tr .mob .mask.dots b.c::after{background:var(--brand);animation:dotblink 1s step-end infinite}
@keyframes dotblink{50%{background:#d3d3db}}
/* hints read as hints, never as a filled-in answer */
body.tr .in::placeholder,body.tr .mob input::placeholder{color:#b9b9c3;opacity:1;font-weight:400;letter-spacing:0}
/* short phones (under 700px tall): smaller boxes, and the picture gives a row to the question */
@media(max-width:899px) and (max-height:700px){
body.tr .in,body.tr .mob{height:46px}body.tr .in,body.tr .mob span,body.tr .mob input{font-size:16px}
body.tr .seg button{height:46px}body.tr .days button,body.tr .slots button{height:44px}
body.tr .q{font-size:17px}
body.tr .app.pic .hero{grid-row:span 4}
body.tr .app.pic .step{grid-row:span 7}
body.tr .app.pic.s1 .step[data-s="1"],body.tr .app.pic.s1 .step[data-s="f"]{grid-row:span 8}
}
/* a phone on its side: picture (or brand panel) on the left, the questions on the right, like a laptop */
@media(max-width:899px) and (max-height:520px) and (orientation:landscape){
body.tr .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100vw;height:100dvh}
body.tr .side{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:20px;color:#fff;background:linear-gradient(150deg,var(--brand) 0%,var(--brand-lt) 100%)}

body.tr .app,body.tr .app.pic{--gap:6px}
body.tr .app .step,body.tr .app.pic .step{grid-row:span 9}
body.tr .app .go{grid-row:span 2}
body.tr .app.s1 .step[data-s="1"],body.tr .app.s1 .step[data-s="f"],body.tr .app.pic.s1 .step[data-s="1"],body.tr .app.pic.s1 .step[data-s="f"]{grid-row:span 11}
body.tr .f label{display:none}
body.tr .app .done,body.tr .app.pic .done{grid-row:span 12;gap:8px}
body.tr .in,body.tr .mob{height:40px}body.tr .in,body.tr .mob span,body.tr .mob input{font-size:15px}

body.tr .tick{width:44px;height:44px}

}

.app.pic .hero{position:relative;overflow:hidden}

(function () {

$("#mb").addEventListener("focus", slots); $("#mb").addEventListener("blur", slots); slots();

function gone(text) {
  $("#wrap").hidden = true; $("#gone").hidden = false;
  $("#goneText").textContent = text || C.closed_text || DEFAULTS.closed_text; $("#goneLogo").innerHTML = LOGO ? logoTag() : "";
}
WIDE.addEventListener("change", () => paint());
const ready = () => document.body.classList.remove("loading");
if (TESTLINK) $("#test").hidden = false;
if (PREVIEW) {
  paint(); ready();
  window.addEventListener("message", (e) => {
    if (!e.data) return;
    if (e.data.type === "lp-preview") { C = Object.assign({}, DEFAULTS, e.data.config || {}); TITLE = e.data.title || ""; LOGO = e.data.logo || ""; setTpl(e.data.template); paint(); }
    if (e.data.type === "lp-goto") { const s = e.data.step;
      $("#done").hidden = true; ["#hero", "#prog", "#go"].forEach((x) => $(x).hidden = false);
      if (s === "done") { if (!d.choice) d.choice = (pairs(C.choices)[0] || [""])[0]; if (!$("#nm").value) $("#nm").value = "Riya Shah";
        if (!d.day) { const b = $("#days button"); if (b) { d.day = b.dataset.v; d.dayLabel = b.dataset.l; } } ref = (C.ref_prefix || "REF") + "-A2M8"; finish(); }
      else go(s || "1"); }
  });
  try { parent.postMessage({ type: "lp-ready" }, "*"); } catch (e) {}
} else if (!SLUG) { gone("This link is not complete."); ready(); }
else {
  rpc("lp_open", { p_slug: SLUG }).then((g) => {
    if (!g) { gone("This page does not exist."); return; }
    C = Object.assign({}, DEFAULTS, g.config || {}); TITLE = g.title || ""; STATUS = g.status; LOGO = g.logo || ""; setTpl(g.template);
    if (!["live", "testing"].includes(STATUS) && !TESTLINK) { gone(); return; }
    if (STATUS === "testing") $("#test").hidden = false;
    paint(); rpc("lp_visit", { p_slug: SLUG, p_test: TESTLINK }, true).catch(() => {});
  }).catch(() => gone("This page could not load. Check your connection and try again.")).finally(ready);
}
})();
</script>
</body>
</html>
