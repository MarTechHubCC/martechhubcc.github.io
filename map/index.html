<meta charset="utf-8">
<title>Interactive Map</title>
<meta name="cc-tool-version" content="V1.0 New Jersey">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the map fills the screen and never moves on a click. Controls float on it; a place opens as a panel over the map. */
:root{
  --ui:#ffffff; --ui-ink:#1f2937; --ui-muted:#5b6472; --ui-line:#dde2e8; --ui-soft:#f2f4f7; --accent:#2c3e8f; --accent-soft:#e6eaf7;
  --sample:#8a5a00; --sample-bg:#fbefd6; --shadow:0 10px 30px rgba(15,23,42,.18);
  --f-display:"Literata",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  /* map palette: Wayfinding */
  --bg:#f4f6f8; --land:#f4f6f8; --block:#e7eaee; --block-edge:none; --block-sw:0; --water:#a8d8f0; --sand:#f1ebdc; --green:#cdeccb;
  --road:#ffffff; --road-edge:#d7dde4; --road-sw:1.6; --ground:#f7f3ea; --site-edge:#2c3e8f; --site-sw:2;
  --lawn:#d5ecc4; --path:#e9dccb; --tree:#9fd28f; --tree-edge:none; --tree-sw:0;
  --roof:#c95b52; --roof-edge:none; --roof-sw:0; --prop:#f0a646; --prop-edge:none;
  --label:#4b5563; --label-halo:#fff; --river-label:#3b82b6;
  --pin-bg:#c95b52; --pin-bg2:#e08d1f; --pin-bg3:#4f7a46; --pin-bg4:#4b5d73; --pin-ink:#fff; --pin-ring:#fff; --pin-on:#2c3e8f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:#1c2320;--ui-ink:#e7ece8;--ui-muted:#9aa69f;--ui-line:#2f3934;--ui-soft:#242c28;--accent:#9fb0f5;--accent-soft:#252d4a;--sample:#f0c46c;--sample-bg:#3a2f17;color-scheme:dark}}
:root[data-theme="dark"]{--ui:#1c2320;--ui-ink:#e7ece8;--ui-muted:#9aa69f;--ui-line:#2f3934;--ui-soft:#242c28;--accent:#9fb0f5;--accent-soft:#252d4a;--sample:#f0c46c;--sample-bg:#3a2f17;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg);color:var(--ui-ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* map */
.mapwrap{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.tilt{position:absolute;inset:0;transform-origin:50% 55%;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage>svg{position:absolute;display:block;overflow:visible}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 60%,var(--bg) 100%)}
.l-bg{fill:var(--bg)} .l-blocks{fill:var(--block);stroke:var(--block-edge);stroke-width:var(--block-sw)}
.l-band,.l-water{fill:var(--water)} .l-foot{fill:var(--land)} .l-sand{fill:var(--sand)} .l-green{fill:var(--green)}
.l-road{fill:var(--road);stroke:var(--road-edge);stroke-width:var(--road-sw);paint-order:stroke}
.site-base{fill:var(--ground);stroke:var(--site-edge);stroke-width:var(--site-sw)}
.p-lawn{fill:var(--lawn)} .p-path{fill:var(--path)}
.p-trees circle{fill:var(--tree);stroke:var(--tree-edge);stroke-width:var(--tree-sw)}
.p-roof{fill:var(--roof);stroke:var(--roof-edge);stroke-width:var(--roof-sw)} .p-prop{fill:var(--prop);stroke:var(--prop-edge);stroke-width:var(--roof-sw)}
.lbl{font-family:var(--f-body);fill:var(--label);font-size:13px;font-weight:500;paint-order:stroke;stroke:var(--label-halo);stroke-width:4px}
.lbl.river{font-size:25px;fill:var(--river-label);font-style:italic}
.extrude,.shadows{display:none}
.route{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.gatemark{fill:#fff;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke}

/* 3D view */
body.v3d{--bg:#e7efe6;--land:#eef2ea;--block:#dfe5dc;--block-edge:#c9d1c6;--block-sw:.4;--water:#8ccbe0;--sand:#efe2c4;--green:#bfe0a6;
  --road:#fff;--road-edge:#cfd8cc;--road-sw:1.2;--ground:#f1e6cc;--site-edge:#9a8a66;--site-sw:.8;--lawn:#c6df9c;--path:#d8b993;--tree:#5f9b4a;--tree-edge:#3f7334;--tree-sw:.6;
  --roof:#d4634f;--roof-edge:#a5432f;--roof-sw:.5;--prop:#e39a3b;--prop-edge:#b46f1a;--label:#2f4a3a;--label-halo:#f5f8f2;--river-label:#1f6c86}
.v3d .mapwrap{perspective:1400px}
.v3d .tilt,.v3d .stage,.v3d .pin{transform-style:preserve-3d}
.v3d .tilt{transform:rotateX(48deg) scale(1.05)}
.v3d .extrude,.v3d .shadows{display:block}
.v3d .bld{transform:translateY(-7px)}
.v3d .vign{background:linear-gradient(to bottom,var(--bg) 0%,transparent 24%,transparent 82%,var(--bg) 100%)}

/* pins */
.pin{position:absolute;width:0;height:0}
.pin button{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(calc(var(--ps,1) / var(--k,1)));min-width:22px;height:22px;padding:0 6px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transform-origin:50% 50%;
  font:500 10.5px/18px var(--f-mono);border:1.5px solid var(--pin-ring);background:var(--c);color:var(--pin-ink);box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .15s}
.pin button:hover{transform:translate(-50%,-50%) scale(calc(var(--ps,1) * 1.2 / var(--k,1)))}
.pin button::before{content:"";position:absolute;inset:-9px}
.pin .nm{display:none;font:500 11px var(--f-body)}
body.names .pin .nm{display:inline}
body.names .pin button{transform-origin:11px 50%;transform:translate(-11px,-50%) scale(calc(var(--ps,1) / var(--k,1)))}
body.names .pin.on button,body.names .pin button:hover{z-index:3}
.pin.on button{background:var(--pin-on);transform:translate(-50%,-50%) scale(calc(var(--ps,1) * 1.3 / var(--k,1)));z-index:2;box-shadow:0 0 0 4px color-mix(in srgb,var(--pin-on) 30%,transparent),0 2px 6px rgba(0,0,0,.3)}
.pin.dim{display:none}
.v3d .pin button{transform-origin:50% 100%;transform:translate(-50%,-100%) rotateX(-48deg) scale(calc(var(--ps,1) / var(--k,1)))}
body.names.v3d .pin button{transform-origin:11px 100%;transform:translate(-11px,-100%) rotateX(-48deg) scale(calc(var(--ps,1) / var(--k,1)))}
.v3d .pin button::before{inset:-9px -9px -4px}
.v3d .pin button::after{content:"";position:absolute;left:50%;bottom:-6px;width:2px;height:6px;margin-left:-1px;background:var(--pin-ring)}
.v3d .pin button:hover{transform:translate(-50%,-100%) rotateX(-48deg) scale(calc(var(--ps,1) * 1.15 / var(--k,1)))}
.v3d .pin.on button{transform:translate(-50%,-100%) rotateX(-48deg) scale(calc(var(--ps,1) * 1.25 / var(--k,1)))}

/* floating controls */
.float{position:fixed;z-index:5}
.panelbox{background:var(--ui);color:var(--ui-ink);border:1px solid var(--ui-line);border-radius:12px;box-shadow:var(--shadow)}
.brand{top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(320px,calc(100vw - 24px));padding:10px 12px}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:650;margin:0;line-height:1.15}
.brand .sub{font-size:12px;color:var(--ui-muted)}
.search{position:relative;margin-top:8px}
.search input{width:100%;padding:8px 10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-soft);color:var(--ui-ink);font:14px var(--f-body)}
.results{margin-top:6px;max-height:min(46vh,360px);overflow:auto}
.results[hidden]{display:none}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:inherit;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.res:hover,.res.k{background:var(--ui-soft)}
.res .n{flex:0 0 32px;font:500 12px var(--f-mono);color:var(--ui-muted)}
.res .d{flex:0 0 8px;height:8px;border-radius:50%}
.views{top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;padding:4px;gap:2px}
.views button{border:0;background:none;color:var(--ui-muted);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.views button svg{width:16px;height:16px}
.views button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tools{right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui);color:var(--ui-ink);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.1)}
.scalebar{left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));font:500 11px var(--f-mono);display:flex;align-items:center;gap:8px;padding:5px 9px}
.scalebar i{display:block;height:6px;border:1.5px solid currentColor;border-top:0}
.legend{right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:nowrap;white-space:nowrap;max-width:calc(100vw - 200px);overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ui-line);background:var(--ui);color:var(--ui-ink);border-radius:999px;padding:5px 11px 5px 9px;font:500 12px var(--f-body);cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.chip i{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.5}

/* place panel (floats over the map) */
.place{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));
  width:min(540px,calc(100vw - 24px));display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .2s,transform .2s}
.place.open{opacity:1;transform:none;pointer-events:auto}
.ptop{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ui-line)}
.btn{border:1px solid var(--ui-line);background:var(--ui);color:var(--ui-ink);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--ui-soft)}
.seg{display:inline-flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:var(--ui-muted);padding:6px 9px;font-size:12px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ptop .pos{font:500 12px var(--f-mono);color:var(--ui-muted);min-width:52px;text-align:center}
.ptop .x{margin-left:auto;font-size:18px;line-height:1;padding:5px 10px}
.pbody{overflow:auto;padding:14px 16px 22px;display:flex;flex-direction:column;gap:16px}
.slide{position:relative;aspect-ratio:16/10;width:100%;border-radius:10px;overflow:hidden;background:var(--ui-soft);cursor:zoom-in}
.slide>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.near .img svg,.thumbs svg.ill{width:100%;height:100%;display:block}
.samplepic{position:absolute;left:10px;top:10px;background:rgba(20,25,23,.6);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide .img{position:absolute;inset:0;background-repeat:no-repeat}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ui-muted);
  background:repeating-linear-gradient(135deg,var(--ui-soft) 0 14px,color-mix(in srgb,var(--ui-soft) 70%,var(--ui)) 14px 28px)}
.ph svg{width:32px;height:32px}
.ph b{color:var(--ui-ink);font-weight:600}
.cap{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 110px);background:rgba(20,25,23,.72);color:#fff;font-size:12px;padding:4px 9px;border-radius:6px}
.count{position:absolute;right:10px;bottom:10px;background:rgba(20,25,23,.72);color:#fff;font:500 11.5px var(--f-mono);padding:4px 8px;border-radius:6px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#1d2421;font-size:18px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.arr.l{left:10px}.arr.r{right:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.thumbs button{flex:0 0 76px;height:48px;border-radius:6px;border:2px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:var(--ui-soft);position:relative}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs .img{position:absolute;inset:0;background-repeat:no-repeat}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .ph svg{width:16px;height:16px}
.num{font:500 12px var(--f-mono);color:var(--accent)}
.samplechip{display:inline-block;margin-left:8px;background:var(--sample-bg);color:var(--sample);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.head h2{font-family:var(--f-display);font-weight:650;font-size:25px;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.head .meaning{display:block;color:var(--ui-muted);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ui-muted);margin-top:6px}
.tag i{width:8px;height:8px;border-radius:50%}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--ui-line);border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;margin:0}
.facts div{background:var(--ui);padding:9px 12px}
.facts dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ui-muted)}
.facts dd{margin:2px 0 0;font-weight:500}
.tba{color:var(--ui-muted);font-weight:400}
.desc p{margin:0 0 9px;max-width:62ch}
.pbody>*{flex-shrink:0}
.visit{border:1px solid var(--ui-line);border-radius:12px;overflow:hidden}
.vtop{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;padding:12px 14px;background:var(--accent-soft)}
.vtime{display:flex;gap:10px;align-items:center;flex:1 1 150px}
.vtime svg{width:30px;height:30px;color:var(--accent);flex:0 0 30px}
.vtime small,.vmeta dt{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ui-muted)}
.vtime b{font:650 20px var(--f-display)}
.vmeta{display:flex;gap:16px;margin:0;flex:2 1 220px}
.vmeta div{min-width:0}
.vmeta dd{margin:2px 0 0;font-weight:500;font-size:13px}
.vsec{padding:12px 14px;border-top:1px solid var(--ui-line)}
.vsec h4{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ui-muted)}
.attr{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.attr li{position:relative;padding-left:16px;font-size:13.5px}
.attr li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.head h2{margin-top:0}
.sec h3{font-family:var(--f-display);font-weight:650;font-size:16px;margin:0 0 6px}
.sec p{margin:0 0 9px}
.card{border:1px solid var(--ui-line);border-radius:10px;padding:12px 14px}
.big{display:flex;gap:20px;margin:4px 0}
.big b{display:block;font:650 21px var(--f-display);font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--ui-muted)}
.fine{color:var(--ui-muted);font-size:12px}
.fac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.fac div{display:flex;align-items:center;gap:8px;font-size:13px}
.fac svg{flex:0 0 22px;width:22px;height:22px;color:var(--accent)}
.near{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.near button{text-align:left;border:1px solid var(--ui-line);background:var(--ui);color:var(--ui-ink);border-radius:10px;padding:0;overflow:hidden;cursor:pointer}
.near button:hover{border-color:var(--accent)}
.near .img{height:70px;background-repeat:no-repeat;background-color:var(--ui-soft)}
.near .t{padding:6px 8px;font-size:12.5px;font-weight:500;line-height:1.3}
.near small{display:block;font:500 11px var(--f-mono);color:var(--ui-muted)}

.lightbox{position:fixed;inset:0;z-index:30;background:rgba(10,12,11,.92);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.lightbox[hidden]{display:none}
.lightbox .slide{width:min(1200px,100%);max-height:86vh;cursor:default}
.lightbox .x{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:22px;cursor:pointer}

@media (max-width:760px){
  .views{top:auto;bottom:max(56px,calc(env(safe-area-inset-bottom,0px) + 56px))}
  .legend{display:none}
  .brand{width:calc(100vw - 80px)}
  .place{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));width:auto;height:80vh;transform:translateY(24px)}
  .place.open{transform:none}
  .near{grid-template-columns:repeat(3,minmax(0,1fr))}
  .near .img{height:56px}
}
@media (prefers-reduced-motion:reduce){.tilt,.place,.pin button{transition:none}}

/* things that can still be selected: panel text and the search box */
.pbody,.pbody *,input{-webkit-user-select:text;user-select:text}
.stage svg text{pointer-events:none}
/* clouds and birds drift above the map; clicks pass through */
.sky{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.cloud{position:absolute;left:-40vw;width:var(--w);height:calc(var(--w) * .42);animation:drift var(--t) linear infinite;animation-delay:var(--d)}
.cloud i,.cloud::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(closest-side at 35% 60%,rgba(255,255,255,.95),rgba(255,255,255,0) 100%),radial-gradient(closest-side at 62% 45%,rgba(255,255,255,.9),rgba(255,255,255,0) 100%),radial-gradient(closest-side at 80% 65%,rgba(255,255,255,.85),rgba(255,255,255,0) 100%);filter:blur(1.5px) drop-shadow(0 6px 10px rgba(40,60,80,.14))}
.cloud::before{background:radial-gradient(closest-side at 50% 55%,rgba(30,45,60,.16),rgba(30,45,60,0) 100%);transform:translate(70px,150px) scale(1.05,.7);filter:blur(10px)}
.c1{--w:340px;--t:150s;--d:-30s;top:14%}
.c2{--w:240px;--t:190s;--d:-120s;top:48%;opacity:.85}
.c3{--w:420px;--t:220s;--d:-70s;top:64%;opacity:.75}
.c4{--w:200px;--t:170s;--d:-155s;top:28%;opacity:.8}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(150vw)}}
.flock{position:absolute;left:-12vw;display:block;animation:fly var(--t) linear infinite;animation-delay:var(--d)}
.f1{--t:38s;--d:-6s;top:22%} .f2{--t:52s;--d:-30s;top:58%}
.flock svg{position:absolute;overflow:visible}
.wing{transform-origin:12px 8px;animation:flap .55s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.35)}}
@keyframes fly{0%{transform:translate(0,0)}50%{transform:translate(62vw,-6vh)}100%{transform:translate(124vw,-2vh)}}
body.v3d .cloud{opacity:.9}

    <div class="seg" role="group" aria-label="Order"><button id="ordPlan" aria-pressed="true">Plan order</button><button id="ordRoute" aria-pressed="false">Visitor route</button></div>
    <button class="btn" id="prev" aria-label="Previous place">&lsaquo;</button><span class="pos" id="pos"></span><button class="btn" id="next" aria-label="Next place">&rsaquo;</button>
    <button class="btn x" id="close" aria-label="Close">&times;</button>
  </div>
  <div class="pbody" id="pbody"></div>
</section>

<div class="lightbox" id="lightbox" hidden><button class="x" id="lbx" aria-label="Close">&times;</button><div class="slide" id="lbslide"></div></div>

<div class="gate" id="gate" hidden><div id="gateText">This map is not available right now.</div></div>
<script>
// Sample illustrations drawn in code, one set per place, so the gallery shows a realistic layout before real photos arrive.
const ILLU=(()=>{
  function rng(seed){let s=0;for(const c of String(seed))s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  const W=800,H=500;
  const SKIES=[["#bfe0f2","#eef6fb"],["#f6d5b8","#fbeee2"],["#c9dcef","#f3efe6"],["#e9c8a8","#f7e7d4"],["#b7d3ea","#e9f2f7"]];
  function sky(r){const s=SKIES[Math.floor(r()*SKIES.length)],id="g"+Math.floor(r()*1e9);
    return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s[0]}"/><stop offset="1" stop-color="${s[1]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`+
      (r()<.6?`<circle cx="${120+r()*560}" cy="${60+r()*50}" r="${22+r()*10}" fill="#fff6dc" opacity=".85"/>`:"")+
      Array.from({length:2+Math.floor(r()*2)},()=>{const x=r()*W,y=40+r()*90;return `<g fill="#fff" opacity=".7"><ellipse cx="${x}" cy="${y}" rx="${40+r()*30}" ry="12"/><ellipse cx="${x+30}" cy="${y-8}" rx="${28}" ry="12"/></g>`;}).join("");}
  function tree(x,y,s,c){c=c||"#5f8f4a";return `<rect x="${x-s*.06}" y="${y-s*.5}" width="${s*.12}" height="${s*.5}" fill="#6b4f3a"/><circle cx="${x}" cy="${y-s*.75}" r="${s*.42}" fill="${c}"/><circle cx="${x-s*.3}" cy="${y-s*.55}" r="${s*.3}" fill="${c}"/><circle cx="${x+s*.32}" cy="${y-s*.6}" r="${s*.32}" fill="${c}" opacity=".92"/>`;}
  function trees(r,n,y0,y1,big,greens){let o="";for(let i=0;i<n;i++){const x=r()*W,y=y0+r()*(y1-y0);o+=tree(x,y,big*(.6+r()*.6),greens[Math.floor(r()*greens.length)]);}return o;}
  const G=["#5f8f4a","#6f9d55","#4f7d40","#7aa65e"];
  function ground(r,col){return `<rect y="${H*.66}" width="${W}" height="${H*.34}" fill="${col||"#d9c9a5"}"/><rect y="${H*.66}" width="${W}" height="6" fill="#000" opacity=".06"/>`;}
  function people(r,n,y){let o="";for(let i=0;i<n;i++){const x=60+r()*680,s=.8+r()*.4,c=["#3d3a36","#7a3b2e","#e9e4d8","#2c3e8f"][Math.floor(r()*4)];
    o+=`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-46" r="7" fill="#5a4030"/><path d="M-8 -38h16l3 26h-22z" fill="${c}"/><rect x="-6" y="-12" width="5" height="14" fill="#4a3b30"/><rect x="1" y="-12" width="5" height="14" fill="#4a3b30"/></g>`;}return o;}
  // tiled-roof heritage building, front view
  function heritage(r,opt={}){const w=opt.w||(380+r()*220),x=(W-w)/2,base=H*.68,wall=opt.wall||"#efe5d2",h=opt.h||(95+r()*30),roof=opt.roof||"#b0563f",cols=Math.max(4,Math.round(w/60));
    let o=`<rect x="${x-10}" y="${base}" width="${w+20}" height="12" fill="#cbb994"/><rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${wall}"/>`;
    const rh=40+r()*14;o+=`<polygon points="${x-30},${base-h+6} ${x+w+30},${base-h+6} ${x+w-10},${base-h-rh} ${x+10},${base-h-rh}" fill="${roof}"/>`;
    for(let k=1;k<6;k++){const yy=base-h+6-k*rh/6;o+=`<line x1="${x-30+k*6}" y1="${yy}" x2="${x+w+30-k*6}" y2="${yy}" stroke="#7e3a2a" stroke-width="1.2" opacity=".55"/>`;}
    o+=`<rect x="${x-30}" y="${base-h+4}" width="${w+60}" height="5" fill="#7e3a2a" opacity=".5"/>`;
    for(let k=0;k<=cols;k++){const cx=x+8+k*(w-16)/cols;o+=`<rect x="${cx-3}" y="${base-h+8}" width="6" height="${h-8}" fill="#f8f2e6" stroke="#cdbf9f" stroke-width=".8"/>`;}
    o+=`<rect x="${x+14}" y="${base-h+8}" width="${w-28}" height="${h-8}" fill="#000" opacity=".07"/>`;
    for(let k=0;k<cols;k++){const cx=x+8+(k+.5)*(w-16)/cols;if(k%2===0)o+=`<rect x="${cx-11}" y="${base-56}" width="22" height="56" fill="#6b4a32"/>`;else o+=`<rect x="${cx-12}" y="${base-h+30}" width="24" height="26" fill="#3f6b55"/><line x1="${cx}" y1="${base-h+30}" x2="${cx}" y2="${base-h+56}" stroke="#2a4a3a"/>`;}
    return o;}
  function museum(r){let o=`<rect y="${H*.62}" width="${W}" height="${H*.38}" fill="#d7c7a2"/><rect y="${H*.78}" width="${W}" height="${H*.1}" fill="#8fc0cf"/>`;
    for(let k=0;k<6;k++){const x=40+k*125,y=H*.62;o+=`<rect x="${x}" y="${y-70}" width="110" height="70" fill="#efe6d4"/><rect x="${x+8}" y="${y-62}" width="94" height="62" fill="#5b4636" opacity=".55"/><polygon points="${x-6},${y-70} ${x+116},${y-70} ${x+55},${y-128}" fill="#b45a40"/><polygon points="${x+55},${y-128} ${x+116},${y-70} ${x+55},${y-70}" fill="#8f4532"/>`;
      o+=`<rect x="${x}" y="${H*.8}" width="110" height="6" fill="#efe6d4" opacity=".35"/>`;}
    return o;}
  function interior(r,thing){let o=`<rect width="${W}" height="${H}" fill="#e9dcc3"/><rect y="${H*.7}" width="${W}" height="${H*.3}" fill="#b98a5c"/><rect x="${W*.62}" y="70" width="190" height="200" fill="#f9f1dc"/><line x1="${W*.62+95}" y1="70" x2="${W*.62+95}" y2="270" stroke="#a5835d" stroke-width="5"/><line x1="${W*.62}" y1="170" x2="${W*.62+190}" y2="170" stroke="#a5835d" stroke-width="5"/>
      <polygon points="${W*.62},270 ${W*.62+190},270 ${W*.62+260},${H*.95} ${W*.62-80},${H*.95}" fill="#fff4d6" opacity=".35"/><rect x="60" y="${H*.72}" width="330" height="70" fill="#d9c49a" opacity=".8"/>`;
    if(thing==="paper")o+=Array.from({length:7},(_,k)=>`<rect x="${110+k*4}" y="${H*.7-14-k*9}" width="190" height="8" fill="${["#f6efe0","#efe3c8","#f9f4ea"][k%3]}" stroke="#cdbb95"/>`).join("")+`<rect x="330" y="${H*.52}" width="120" height="90" fill="#7a5a3c"/><rect x="340" y="${H*.54}" width="100" height="60" fill="#c8dfe6" opacity=".6"/>`;
    else o+=`<g transform="translate(220 ${H*.62})" fill="none" stroke="#4a3526" stroke-width="5"><circle r="70"/><circle r="8" fill="#4a3526"/>${Array.from({length:8},(_,k)=>`<line x1="0" y1="0" x2="${70*Math.cos(k*Math.PI/4)}" y2="${70*Math.sin(k*Math.PI/4)}" stroke-width="3"/>`).join("")}<line x1="-80" y1="80" x2="120" y2="80"/><line x1="70" y1="0" x2="160" y2="40" stroke-width="2"/></g><rect x="370" y="${H*.7}" width="60" height="16" fill="#efe6d4"/>`;
    return o;}
  function garden(r,dense){let o=ground(r,"#b9cf8e")+`<path d="M${W*.42} ${H} C ${W*.46} ${H*.85}, ${W*.52} ${H*.75}, ${W*.5} ${H*.66} L ${W*.54} ${H*.66} C ${W*.58} ${H*.75}, ${W*.66} ${H*.85}, ${W*.7} ${H}Z" fill="#dcc79f"/>`;
    o+=trees(r,dense?26:12,H*.64,H*.95,dense?150:110,G);if(!dense)o+=`<rect x="${W*.18}" y="${H*.84}" width="80" height="8" fill="#7a5a3c"/><rect x="${W*.18+6}" y="${H*.85}" width="4" height="18" fill="#5a4030"/><rect x="${W*.18+70}" y="${H*.85}" width="4" height="18" fill="#5a4030"/>`;
    if(dense)o+=`<ellipse cx="${W*.3}" cy="${H*.9}" rx="90" ry="16" fill="#8fc0cf"/>`;return o;}
  function river(r,bridge){let o=`<rect y="${H*.5}" width="${W}" height="${H*.3}" fill="#8cc4d6"/>`+Array.from({length:8},()=>`<rect x="${r()*W}" y="${H*.52+r()*H*.26}" width="${30+r()*60}" height="2" fill="#fff" opacity=".5"/>`).join("")+
      `<g fill="#b8c2c9">${Array.from({length:14},(_,k)=>`<rect x="${k*60+r()*20}" y="${H*.5-20-r()*40}" width="${30+r()*20}" height="${60}" />`).join("")}</g><rect y="${H*.48}" width="${W}" height="${H*.03}" fill="#a9c79a"/>`;
    o+=`<rect y="${H*.8}" width="${W}" height="${H*.2}" fill="#e6dccb"/><rect y="${H*.8}" width="${W}" height="6" fill="#b5a88f"/>`;
    if(bridge)o+=`<rect x="0" y="${H*.56}" width="${W}" height="12" fill="#7a3b2e"/>${Array.from({length:9},(_,k)=>`<rect x="${k*100+40}" y="${H*.56}" width="8" height="${H*.24}" fill="#6a3125"/>`).join("")}`;
    else o+=people(r,5,H*.95);
    return o;}
  function pond(r){return ground(r,"#b9cf8e")+`<ellipse cx="${W/2}" cy="${H*.82}" rx="330" ry="60" fill="#7fb7c9"/><ellipse cx="${W/2}" cy="${H*.82}" rx="330" ry="60" fill="none" stroke="#c9b48c" stroke-width="10"/>`+trees(r,8,H*.66,H*.7,120,G)+Array.from({length:6},()=>`<rect x="${W/2-200+r()*400}" y="${H*.78+r()*40}" width="${40+r()*50}" height="2" fill="#fff" opacity=".55"/>`).join("");}
  function modern(r,opt={}){const base=H*.7,x=120,w=560;let o=`<rect x="${x}" y="${base-150}" width="${w}" height="150" fill="${opt.wall||"#c98b5b"}"/><rect x="${x-20}" y="${base-160}" width="${w+40}" height="14" fill="#efe6d4"/>`;
    for(let k=0;k<20;k++)o+=`<rect x="${x+12+k*27.5}" y="${base-140}" width="8" height="130" fill="#efe6d4" opacity=".85"/>`;
    o+=`<rect x="${x+200}" y="${base-90}" width="160" height="90" fill="#3c4a4d" opacity=".75"/>`;
    if(opt.awning)o+=`<polygon points="${x+170},${base-96} ${x+390},${base-96} ${x+410},${base-74} ${x+150},${base-74}" fill="#e9b04a"/>`;
    return o+`<rect x="${x-40}" y="${base}" width="${w+80}" height="10" fill="#cbb994"/>`;}
  function food(r){let o=modern(r,{wall:"#d39a6a",awning:1});for(let k=0;k<5;k++){const x=110+k*140;o+=`<ellipse cx="${x}" cy="${H*.9}" rx="34" ry="8" fill="#7a5a3c"/><rect x="${x-3}" y="${H*.9}" width="6" height="22" fill="#5a4030"/><polygon points="${x-50},${H*.84} ${x+50},${H*.84} ${x},${H*.74}" fill="${k%2?"#f1e3c2":"#c95b52"}"/><rect x="${x-1.5}" y="${H*.78}" width="3" height="${H*.12}" fill="#5a4030"/>`;}return o;}
  function gate(r){return ground(r,"#cdbf9f")+`<rect x="250" y="${H*.32}" width="40" height="${H*.36}" fill="#efe5d2"/><rect x="510" y="${H*.32}" width="40" height="${H*.36}" fill="#efe5d2"/><path d="M250 ${H*.34} Q400 ${H*.14} 550 ${H*.34}" fill="none" stroke="#b0563f" stroke-width="22"/><rect x="310" y="${H*.36}" width="180" height="34" fill="#efe5d2"/><text x="400" y="${H*.36+23}" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#6b4a32">Gandhi Ashram</text>`+people(r,4,H*.93);}
  function parking(r){let o=ground(r,"#c4c9cc");for(let k=0;k<9;k++)o+=`<rect x="${30+k*88}" y="${H*.74}" width="4" height="${H*.22}" fill="#fff" transform="skewX(-20)"/>`;
    for(let k=0;k<4;k++)o+=`<g transform="translate(${80+k*180} ${H*.86})"><rect x="0" y="-22" width="110" height="26" rx="8" fill="${["#c95b52","#e9e4d8","#2c3e8f","#5d6862"][k]}"/><rect x="18" y="-38" width="70" height="20" rx="6" fill="#8fb7c9"/><circle cx="22" cy="6" r="9" fill="#222"/><circle cx="88" cy="6" r="9" fill="#222"/></g>`;
    return o+trees(r,5,H*.64,H*.68,110,G);}
  function memorial(r){return ground(r,"#d7c7a2")+`<ellipse cx="400" cy="${H*.82}" rx="260" ry="50" fill="#e9dfc8" stroke="#b9a77f" stroke-width="4"/><ellipse cx="400" cy="${H*.8}" rx="110" ry="22" fill="#cdbf9f"/><rect x="360" y="${H*.66}" width="80" height="44" fill="#efe5d2"/><polygon points="350,${H*.66} 450,${H*.66} 400,${H*.58}" fill="#b0563f"/>`+Array.from({length:14},(_,k)=>`<circle cx="${190+k*30}" cy="${H*.9+((k%2)*6)}" r="6" fill="${["#e9b04a","#c95b52","#f1e3c2"][k%3]}"/>`).join("")+trees(r,6,H*.64,H*.68,120,G);}
  function amphi(r){let o=ground(r,"#cdbf9f");for(let k=0;k<5;k++)o+=`<path d="M${120+k*30} ${H*.66+k*30} Q400 ${H*.6+k*36+60} ${680-k*30} ${H*.66+k*30}" fill="none" stroke="#b9a77f" stroke-width="16"/>`;return o+`<ellipse cx="400" cy="${H*.7}" rx="90" ry="16" fill="#b0563f"/>`+trees(r,6,H*.62,H*.66,100,G);}
  function tiles(r){let o=`<rect width="${W}" height="${H}" fill="#9e4a36"/>`;for(let y=0;y<H;y+=26)for(let x=-(y/26%2)*30;x<W;x+=60)o+=`<path d="M${x} ${y+26} q30 -34 60 0" fill="#b65a42" stroke="#7e3a2a" stroke-width="2"/>`;return o;}
  function wall(r){let o=`<rect width="${W}" height="${H}" fill="#efe5d2"/><rect x="300" y="80" width="200" height="340" fill="#6b4a32"/><rect x="316" y="96" width="78" height="150" fill="#5a3c28"/><rect x="406" y="96" width="78" height="150" fill="#5a3c28"/><circle cx="392" cy="270" r="6" fill="#d9b46a"/><circle cx="408" cy="270" r="6" fill="#d9b46a"/>`;
    return o+`<rect x="0" y="420" width="${W}" height="80" fill="#cbb994"/><rect x="560" y="300" width="70" height="120" fill="#b0563f" opacity=".2"/>`;}
  const scene={heritage:r=>sky(r)+ground(r)+trees(r,5,H*.66,H*.7,120,G)+heritage(r)+trees(r,2,H*.9,H*.98,90,G)+people(r,2,H*.92),
    courtyard:r=>sky(r)+ground(r)+heritage(r,{w:620,h:110})+`<rect x="300" y="${H*.71}" width="200" height="${H*.29}" fill="#c9b48c"/>`+tree(400,H*.86,110,"#6f9d55"),
    kutir:r=>sky(r)+ground(r,"#cdbf9f")+trees(r,6,H*.62,H*.68,130,G)+heritage(r,{w:260,h:90}),
    row:r=>sky(r)+ground(r)+heritage(r,{w:720,h:85})+trees(r,3,H*.92,H*.99,80,G),
    museum:r=>sky(r)+museum(r)+people(r,3,H*.76),interior:r=>interior(r,"charkha"),paper:r=>interior(r,"paper"),
    garden:r=>sky(r)+garden(r,false),forest:r=>sky(r)+garden(r,true),river:r=>sky(r)+river(r,false),bridge:r=>sky(r)+river(r,true),pond:r=>sky(r)+pond(r),
    modern:r=>sky(r)+ground(r)+trees(r,3,H*.66,H*.7,110,G)+modern(r)+people(r,3,H*.9),shop:r=>sky(r)+ground(r)+modern(r,{wall:"#b98256",awning:1})+people(r,4,H*.92),
    food:r=>sky(r)+ground(r)+food(r),gate:r=>sky(r)+gate(r),parking:r=>sky(r)+parking(r),memorial:r=>sky(r)+memorial(r),amphi:r=>sky(r)+amphi(r),tiles:tiles,door:wall,
    cow:r=>sky(r)+ground(r,"#cdbf9f")+heritage(r,{w:520,h:80,wall:"#e6dcc6"})+`<g transform="translate(220 ${H*.9})"><ellipse rx="60" ry="26" fill="#efe9de"/><circle cx="58" cy="-14" r="16" fill="#efe9de"/><rect x="-44" y="10" width="8" height="30" fill="#efe9de"/><rect x="36" y="10" width="8" height="30" fill="#efe9de"/></g>`};
  const PLAN={"1":["gate","garden","door"],"2":["parking","gate","garden"],"3":["modern","interior","garden"],"4":["modern","garden","door"],"5":["gate","modern","garden"],"6":["modern","parking","garden"],
    "7":["cow","garden","tiles"],"9":["museum","interior","tiles"],"10":["heritage","interior","door"],"11":["kutir","garden","door"],"14":["heritage","paper","tiles"],"15":["courtyard","interior","tiles"],
    "16":["courtyard","row","door"],"18":["row","garden","door"],"19":["row","door","tiles"],"22":["courtyard","interior","tiles"],"24":["pond","garden","forest"],"25":["courtyard","garden","door"],
    "37":["shop","interior","garden"],"38":["food","garden","modern"],"39":["amphi","garden","tiles"],"40":["garden","forest","garden"],"41":["modern","paper","garden"],"42":["forest","pond","garden"],
    "43":["memorial","garden","river"],"44":["bridge","river","garden"],"27a":["kutir","garden","door"],"27b":["kutir","garden","door"],"27c":["kutir","garden","door"],"27d":["kutir","garden","door"],
    "34":["kutir","garden","tiles"],"36":["kutir","row","door"],"35":["row","door","tiles"]};
  const CAPS={heritage:"Front view",courtyard:"Courtyard",kutir:"Cottage",row:"Along the building",museum:"Pavilions and water court",interior:"Inside",paper:"Paper workshop",garden:"Garden path",forest:"Under the trees",
    river:"Riverfront",bridge:"The bridge",pond:"The pond",modern:"Front view",shop:"Shop front",food:"Seating area",gate:"Entrance",parking:"Parking",memorial:"Memorial plaza",amphi:"Seating tiers",tiles:"Roof tiles",door:"Doorway",cow:"Cowshed"};
  return function(it){const kinds=PLAN[it.id]||(it.cat==="proposed"?["modern","interior","garden"]:it.cat==="landscape"?["garden","forest","pond"]:["heritage","interior","door"]);
    return kinds.map((k,n)=>{const r=rng(it.id+":"+n);return {ill:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${scene[k](r)}</svg>`,cap:CAPS[k]};});};
})();

  pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){last=null;map.classList.remove("drag");}else{const p=[...pts.values()][0];last={x:p.x,y:p.y};}}
map.addEventListener("pointerup",up);map.addEventListener("pointercancel",up);
window.addEventListener("resize",()=>fit(false));

// views
function setView(three,quiet){if(three&&!quiet)track("v:3d");is3d=three;setTimeout(()=>apply(false),0);document.body.classList.toggle("v3d",three);$("#vFlat").setAttribute("aria-pressed",!three);$("#v3d").setAttribute("aria-pressed",three);
  try{localStorage.setItem("ashram-view",three?"3d":"map");}catch(e){}}
$("#vFlat").onclick=()=>setView(false);$("#v3d").onclick=()=>setView(true);

// search
function match(it,q){return (it.id+" "+it.name+" "+(it.meaning||"")).toLowerCase().includes(q);}
$("#q").addEventListener("input",()=>{const q=$("#q").value.trim().toLowerCase(),r=$("#results");if(!q){r.hidden=true;return;}
  const hits=ITEMS.map((it,i)=>[it,i]).filter(([it])=>match(it,q)).slice(0,10);r.hidden=false;
  r.innerHTML=hits.length?hits.map(([it,i],k)=>`<button class="res${k===0?" k":""}" data-i="${i}"><span class="n">${esc(it.id)}</span><span class="d" style="background:var(${CAT[it.cat].c})"></span>${esc(it.name)}</button>`).join(""):'<div class="fine" style="padding:6px">No place matches.</div>';
  r.querySelectorAll(".res").forEach(b=>b.onclick=()=>{open(+b.dataset.i);});});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const f=$("#results .res");if(f)open(+f.dataset.i);}if(e.key==="Escape"){$("#q").value="";$("#results").hidden=true;}});

function crop(p,zoom){const bw=2140*zoom,bh=1590*zoom,ox=(p[0]+520)*zoom,oy=(p[1]+420)*zoom;
  return `background-image:url("${PLAN_SRC}");background-size:${bw}px ${bh}px;background-position:calc(50% - ${ox-bw/2}px) calc(50% - ${oy-bh/2}px)`;}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function nearby(i){const p=ITEMS[i].pins[0];return ITEMS.map((it,k)=>({k,d:dist(it.pins[0],p)})).filter(o=>o.k!==i&&ITEMS[o.k].cat!=="facility").sort((a,b)=>a.d-b.d).slice(0,3).map(o=>o.k);}
const seq=()=>order==="plan"?ITEMS.map((_,k)=>k):ROUTE.map(id=>ITEMS.findIndex(it=>it.id===id)).filter(k=>k>=0);

// gallery
function buildSlides(it){const real=(it.photos||[]).map(p=>({src:p.src,cap:p.caption||""}));const s=real.length?real:ILLU(it);s.push({plan:true,cap:"On the masterplan"});return s;}
function slideHTML(sl,it,zoomv){if(sl.ill)return sl.ill+'<span class="samplepic">Sample image</span>';if(sl.src)return `<img src="${esc(sl.src)}" alt="${esc(sl.cap)}">`;if(sl.plan)return `<div class="img" style='${crop(it.pins[0],zoomv)}'></div>`;
  return `<div class="ph">${svg(CAM)}<b>${esc(sl.cap)}</b><span>Photo to come</span></div>`;}
function slideFrame(el,zoomv){const it=ITEMS[active],sl=slides[slideIx];el.innerHTML=slideHTML(sl,it,zoomv)+`<span class="cap">${esc(sl.cap)}</span><span class="count">${slideIx+1} / ${slides.length}</span><button class="arr l" aria-label="Previous photo">&lsaquo;</button><button class="arr r" aria-label="Next photo">&rsaquo;</button>`;
  el.querySelector(".l").onclick=e=>{e.stopPropagation();show(slideIx-1);};el.querySelector(".r").onclick=e=>{e.stopPropagation();show(slideIx+1);};}
function show(n){slideIx=(n+slides.length)%slides.length;slideFrame($("#slide"),1.3);document.querySelectorAll(".thumbs button").forEach((b,k)=>b.setAttribute("aria-current",k===slideIx));if(!$("#lightbox").hidden)slideFrame($("#lbslide"),1.9);}
$("#lbx").onclick=()=>$("#lightbox").hidden=true;$("#lightbox").onclick=e=>{if(e.target.id==="lightbox")$("#lightbox").hidden=true;};

// place panel: opens over the map; the map does not move
const fact=(l,v)=>`<div><dt>${l}</dt><dd>${v?esc(v):'<span class="tba">To be added</span>'}</dd></div>`;
function open(i,quiet){
  if(!quiet)track("p:"+String(ITEMS[i].id).toLowerCase());
  active=i;const it=ITEMS[i],c=CAT[it.cat],nb=nearby(i);slides=buildSlides(it);slideIx=0;
  const fac=(it.facilities||[]).filter(k=>FAC[k]);
  pbody.innerHTML=`<div><div class="slide" id="slide" tabindex="0" role="button" aria-label="Open photo full screen"></div>
   <div class="thumbs">${slides.map((sl,k)=>`<button data-k="${k}" aria-label="Photo ${k+1}">${sl.ill?sl.ill.replace("<svg ",'<svg class="ill" '):sl.src?`<img src="${esc(sl.src)}" alt="">`:sl.plan?`<div class="img" style='${crop(it.pins[0],0.8)}'></div>`:`<div class="ph">${svg(CAM)}</div>`}</button>`).join("")}</div></div>
   <div class="head"><h2>${esc(it.name)}</h2>${it.meaning?`<span class="meaning">${esc(it.meaning)}</span>`:""}</div>
   <div class="desc">${(it.about||"").split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
   <div class="visit">
    <div class="vtop"><div class="vtime">${svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>')}<div><small>Time to spend</small><b>${it.time?esc(it.time):'<span class="tba">To be added</span>'}</b></div></div>
     <dl class="vmeta"><div><dt>Hours</dt><dd>${it.hours?esc(it.hours.replace(/^Sample:\s*/,"")):'<span class="tba">To be added</span>'}</dd></div><div><dt>Access</dt><dd>${it.access?esc(it.access):'<span class="tba">To be added</span>'}</dd></div></dl></div>
    <div class="vsec"><h4>Attractions</h4>${(it.attractions||[]).length?`<ul class="attr">${it.attractions.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:'<span class="tba">To be added</span>'}</div>
    <div class="vsec"><h4>Facilities</h4>${fac.length?`<div class="fac">${fac.map(k=>`<div>${svg(FAC[k][1])}${FAC[k][0]}</div>`).join("")}</div>`:'<span class="tba">To be added</span>'}</div>
   </div>
   <div class="sec"><h3>Nearby</h3><div class="near">${nb.map(k=>`<button data-k="${k}"><div class="img">${(ITEMS[k].photos||[]).length?`<img src="${esc(ITEMS[k].photos[0].src)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`:ILLU(ITEMS[k])[0].ill}</div><div class="t"><small>No. ${esc(ITEMS[k].id)}</small>${esc(ITEMS[k].name)}</div></button>`).join("")}</div></div>`;
  show(0);
  $("#slide").onclick=()=>{$("#lightbox").hidden=false;slideFrame($("#lbslide"),1.9);};$("#slide").onkeydown=e=>{if(e.key==="Enter")$("#slide").click();};
  pbody.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>show(+b.dataset.k));
  pbody.querySelectorAll(".near button").forEach(b=>b.onclick=()=>open(+b.dataset.k));
  centreOn(it.pins[0],null,700);
  ITEMS.forEach((o,k)=>o.els.forEach(el=>el.classList.toggle("on",k===i)));filterPins();
  const s=seq(),ix=s.indexOf(i);$("#pos").textContent=ix>=0?`${ix+1} of ${s.length}`:"–";
  panel.classList.add("open");panel.setAttribute("aria-hidden","false");pbody.scrollTop=0;$("#results").hidden=true;
  try{history.replaceState(null,"","#place-"+it.id);}catch(e){}
}
function close(){active=null;panel.classList.remove("open");panel.setAttribute("aria-hidden","true");ITEMS.forEach(o=>o.els.forEach(el=>el.classList.remove("on")));filterPins();
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
$("#close").onclick=close;
function step(d){const s=seq();let ix=s.indexOf(active);ix=ix<0?0:(ix+d+s.length)%s.length;open(s[ix]);}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
function setOrder(o){order=o;$("#ordPlan").setAttribute("aria-pressed",o==="plan");$("#ordRoute").setAttribute("aria-pressed",o==="route");if(active!==null){const s=seq(),ix=s.indexOf(active);$("#pos").textContent=ix>=0?`${ix+1} of ${s.length}`:"–";}}
$("#ordPlan").onclick=()=>setOrder("plan");$("#ordRoute").onclick=()=>setOrder("route");
window.addEventListener("keydown",e=>{if(e.target.matches("input"))return;
  if(!$("#lightbox").hidden){if(e.key==="Escape")$("#lightbox").hidden=true;if(e.key==="ArrowRight")show(slideIx+1);if(e.key==="ArrowLeft")show(slideIx-1);return;}
  if(active===null)return;if(e.key==="Escape")close();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1);});

/* ── MarTech: the words and photos come from the map's campaign (im_open) ──
     ?m=<slug>     the map to show (Gandhi Ashram if none)
     ?test=1       a Test link: everything recorded is marked test
     ?preview=1    MarTech's Setup preview: no database; draws what MarTech sends (im-preview) */
const SB_URL="https://qsxldzqdjdplffxqdokd.supabase.co",SB_KEY="sb_publishable_6ng_3jnvQbJUZifYTxmRrw_0yhCZuY9";
const QS=new URLSearchParams(location.search);
const SLUG=(QS.get("m")||"gandhi-ashram").toLowerCase().replace(/[^a-z0-9-]/g,""),PREVIEW=QS.get("preview")==="1",TESTLINK=QS.get("test")==="1";
function rpc(fn,args,keep){return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",keepalive:!!keep,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"content-type":"application/json"},body:JSON.stringify(args)})
  .then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||"Something went wrong");return j;});}
let READY=false;
function track(key){if(PREVIEW||!READY)return;rpc("im_event",{p_slug:SLUG,p_key:key,p_test:TESTLINK},true).catch(()=>{});}
const FIELDS=["name","meaning","about","time","hours","access","status","attractions","facilities","photos"];
function applyConfig(cfg){
  if(!cfg)return;
  if(cfg.title)$("#mapTitle").textContent=cfg.title;
  if(cfg.subtitle!=null)$("#mapSub").textContent=cfg.subtitle;
  if(cfg.title)document.title=cfg.title;
  (cfg.places||[]).forEach(p=>{const it=ITEMS.find(x=>x.id===String(p.id));if(!it)return;
    FIELDS.forEach(f=>{if(p[f]!==undefined)it[f]=p[f];});
    it.photos=(it.photos||[]).filter(x=>x&&(x.url||x.src)).map(x=>({src:x.url||x.src,caption:x.caption||""}));
    it.els.forEach(el=>{const b=el.querySelector("button");if(b){b.setAttribute("aria-label",it.id+" "+it.name);const nm=b.querySelector(".nm");if(nm)nm.textContent=it.name;}});});
  if(active!==null)open(active,true);
}
function gate(text){$("#gateText").textContent=text;$("#gate").hidden=false;}
if(PREVIEW){
  window.addEventListener("message",e=>{if(!e.data||e.data.type!=="im-preview")return;applyConfig(e.data.config);
    if(e.data.place){const k=ITEMS.findIndex(it=>it.id===String(e.data.place));if(k>=0&&k!==active)open(k,true);}});
  try{parent.postMessage({type:"im-ready"},"*");}catch(e){}
}else{
  rpc("im_open",{p_slug:SLUG}).then(g=>{
    if(!g){gate("This map is not here.");return;}
    applyConfig(g.config);
    const open_=g.status==="live"||g.status==="testing";
    if(!open_&&!TESTLINK){gate((g.config&&g.config.closed_text)||"This map is not available right now.");return;}
    if(g.status==="testing"||TESTLINK)$("#testTag").hidden=false;
    READY=true;track("open");
    if(active!==null)track("p:"+String(ITEMS[active].id).toLowerCase());
  }).catch(()=>{});
}

// start
layout();
try{if(localStorage.getItem("ashram-view")==="3d")setView(true,true);}catch(e){}
// glide the map so a point sits in the middle of the open area (left of the panel, or above it on a phone)
function centreOn(p,nz,dur){const phone=innerWidth<=760,pw=phone?0:Math.min(540,innerWidth-24)+24,sh=phone?innerHeight*0.8+8:0;
  if(nz)z=Math.max(minZ(),Math.min(nz,8));const cx=(innerWidth-pw)/2,cy=(innerHeight-sh)/2;tx=cx-p[0]*z;ty=cy-p[1]*z;clampPan();apply(true,dur);}
fit(false);
const m=location.hash.match(/^#place-([0-9a-z]+)$/);if(m){const k=ITEMS.findIndex(it=>it.id===m[1]);if(k>=0)open(k);}
else{const hk=ITEMS.find(it=>it.id==="10");setTimeout(()=>{const ph=innerWidth<=760;z=ZFIT*2.1;tx=innerWidth/2-(hk.pins[0][0]+40)*z;ty=innerHeight/2-(hk.pins[0][1]-95)*z;clampPan();apply(true,2600);},700);}
</script>
